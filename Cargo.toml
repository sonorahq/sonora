[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.50.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sonorahq/sonora"

