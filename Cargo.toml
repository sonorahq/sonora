    "aac",
    "mkv",
    "ogg",
    "isomp4",
] }
tempfile = "3.27"
tray-icon = { version = "0.27", default-features = false }
unic-langid = { version = "0.9", features = ["macros"] }
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
