[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.49.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/sonorahq/sonora"

[workspace.dependencies]
embed = { path = "crates/embed" }
cli = { path = "crates/cli" }
i18n = { path = "crates/i18n" }
icons = { path = "crates/icons" }
music = { path = "crates/music" }
state = { path = "crates/state" }
storage = { path = "crates/storage" }
input = { path = "crates/input" }
router = { path = "crates/router" }
ui = { path = "crates/ui" }
views = { path = "crates/views" }
webview = { path = "crates/webview" }
widevine = { path = "crates/widevine" }

alsa = "0.11"
anyhow = "1.0"
ardftsrc = "0.4.4"
async-trait = "0.1"
base64 = "0.23"
blowfish = "0.10"
bytes = "1"
cbc = "0.2"
cc = "1"
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
clap_complete = "4.6"
flate2 = "1"
cpal = "0.18"
dirs = "7"
discord-rich-presence = "1.1"
deunicode = "1.6"
env_logger = "0.11"
fastrand = "2.5"
futures = "0.3"
gethostname = "1.1"
fluent-bundle = "0.16"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "8ddac49c8b5a079149b33b4581e03f74e05237e0" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "8ddac49c8b5a079149b33b4581e03f74e05237e0", features = [
    "font-kit",
    "wayland",
    "x11",
] }
http = "1.5"
winresource = "0.1"
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Power",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"
interprocess = "2.4"
widestring = "1.2"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
jiff = { version = "0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-bundle-platform",
    "tzdb-zoneinfo",
] }
kakasi = "0.1"
ksni = { version = "0.3", default-features = false, features = [
    "async-io",
    "blocking",
] }
zbus = { version = "6", default-features = false, features = [
    "proxy",
    "tokio",
] }
libc = "0.2"
lofty = "0.25"
log = "0.4"
md-5 = "0.11"
moka = { version = "0.12", features = ["future", "sync"] }
mpris-server = "0.11"
notify = "8.2"
oauth2 = "5.0"
open = "5.4"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
] }
objc2-core-audio = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusItem",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFString",
] }
objc2-io-kit = { version = "0.3", default-features = false, features = [
    "std",
    "pwr_mgt",
] }
ashpd = { version = "0.14", default-features = false, features = [
    "async-io",
    "inhibit",
    "settings",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "query",
    "rustls-no-provider",
] }
qrcodegen = "1"
raw-window-handle = "0.6"
resvg = { version = "0.49", default-features = false }
ring = "0.17"
roxmltree = "0.21"
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "experimental",
] }
rtrb = "0.4"
rusqlite = { version = "0.40" }
# Pinned exactly: a young crate, and the decoder every HE-AAC stream goes through.
rusty_aac = { version = "=1.1.2", default-features = false }
rustfft = "6.4"
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde-saphyr = { version = "2.1", default-features = false, features = [
    "deserialize",
] }
sha2 = "0.11"
smallvec = { version = "1.16", features = ["union"] }
souvlaki = "0.9"
sys-locale = "0.3"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "mkv",
    "ogg",
    "isomp4",
] }
tempfile = "3.27"
tray-icon = { version = "0.26", default-features = false }
unic-langid = { version = "0.9", features = ["macros"] }
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
ytmusic = { git = "https://github.com/sonorahq/ytmusic-rs", rev = "99f7d14" }

librespot-core = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-oauth = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-playback = { version = "0.8.0", default-features = false, features = [
    "rustls-tls-native-roots",
] }
librespot-protocol = "0.8.0"
percent-encoding = "2.3"
protobuf = "3"
pulseaudio = "0.3.2"
opensubsonic = "0.7"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "process",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }

[patch.crates-io]
librespot-audio = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-core = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-metadata = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-oauth = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-playback = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
librespot-protocol = { git = "https://github.com/sonorahq/librespot", rev = "84f551d4afc7823ef12b6b02d09e34e2ddaccf99" }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "880aaba54b00aead53651ed1ccbdb672d1375a95" }

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
dbg_macro = "warn"
empty_drop = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
set_contains_or_insert = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
large_stack_frames = "warn"
or_fun_call = "warn"
large_types_passed_by_value = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2

# The audio path runs in real time, decoding, resampling and mixing every sample, so it is built
# fully optimised even in debug builds.
[profile.dev.package.music]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.ardftsrc]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.rusty_aac]
opt-level = 3
