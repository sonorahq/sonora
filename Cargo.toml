tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "process",
    "sync",
    "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }

[patch.crates-io]
# Symphonia 0.6.1 plus a fix that decodes the 33-bit side channel of 32-bit stereo FLAC. Every
# Symphonia crate comes from the fork, so the codec traits rodio and Sonora share stay one type.
symphonia = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-core = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-common = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-metadata = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-bundle-flac = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-bundle-mp3 = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-codec-aac = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-codec-alac = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-codec-pcm = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-codec-vorbis = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-format-isomp4 = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-format-mkv = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-format-ogg = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
symphonia-format-riff = { git = "https://github.com/sonorahq/Symphonia", rev = "b8600e881fdecd27a77925b7f74119efa8630c3a" }
# RustAudio/rodio#920, which moves rodio to Symphonia 0.6, with its seeks fixed to keep the channel
# order and to end the track when a seek lands past what the demuxer can reach.
rodio = { git = "https://github.com/sonorahq/rodio", rev = "aae5ad20127b258f293c1a073d3692bfa81c52ac" }
opensubsonic = { git = "https://github.com/sonorahq/opensubsonic-rs", rev = "addaa7a4a17b796cc3b6d4bcdea2aa9559d6132c" }

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
dbg_macro = "warn"
empty_drop = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
set_contains_or_insert = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
large_stack_frames = "warn"
or_fun_call = "warn"
large_types_passed_by_value = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
split-debuginfo = "unpacked"
# File and line numbers for backtraces and profilers, without the types and variables a debugger
# shows. Full debug info made compiling the workspace crates take 30% more CPU time.
debug = "line-tables-only"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2

# The audio path runs in real time, decoding, resampling and mixing every sample, so it is built
# fully optimised even in debug builds.
[profile.dev.package.sound]
opt-level = 3

[profile.dev.package.engine]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.ardftsrc]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.rusty_aac]
opt-level = 3
