percent-encoding = "2.3"
prost = "0.14"
prost-types = "0.14"
pulseaudio = "0.3.2"
# Without a provider of its own, so reqwest stops compiling aws-lc-rs beside the ring every client
# uses. The fork's sonora branch adds the feature, which upstream PR #12 (branch tls-features)
# proposes, and several music folders per request (sonorahq/opensubsonic-rs, branch sonora).
