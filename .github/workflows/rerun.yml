name: rerun

# GitHub cancels a job it finds no hosted runner for within fifteen minutes, which keeps happening
# to the macOS arm64 jobs while that pool is short of machines. Such a job never ran a step, so
# this runs it again instead of leaving that to whoever notices. unacquired.sh decides which runs
# qualify. It only reads the repository's own main, never the code of the run it looks at.
on:
  workflow_run:
    workflows: [ci, nix, nightly, release]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/rerun
          persist-credentials: false

      - name: rerun the jobs no runner took
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/rerun/unacquired.sh
