name: ci

# A change that only touches prose, issue templates or bot configuration cannot change what
# compiles, so it skips the run entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - .github/ISSUE_TEMPLATE/**
      - .github/triage/**
      - .github/labeler.yml
      - .coderabbit.yaml
  pull_request:
    paths-ignore:
      - "**/*.md"
      - .github/ISSUE_TEMPLATE/**
      - .github/triage/**
      - .github/labeler.yml
      - .coderabbit.yaml
  workflow_dispatch:

# A pull request event handled after the merge resolves github.ref to the base branch, so
# grouping by ref would let a late PR run and a push to main cancel each other. The PR number
# keeps the two apart. A new push to a pull request supersedes its last run, but a push to main
# never cancels one: main merges more often than its builds finish, so cancelling left nearly
# every commit without its binaries. A run already queued behind still gives way to a newer one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1

jobs:
  # A release branch only moves the version and the changelog over code main already checked,
  # and release.yml builds its merge for the tag, so neither its pull request nor its merge runs
  # here.
  # Lint and tests run as two jobs side by side, since they compile the workspace two different
  # ways and share nothing but the setup.
  check:
    name: ${{ matrix.name }}
    if: >-
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt and clippy
            task: lint
          - name: tests
            task: test
    steps:
      - uses: actions/checkout@v7

      # Restores the packages' files instead of running apt, which spends most of its time
      # refreshing the package index.
      - name: system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential pkg-config cmake mold
            libasound2-dev libfontconfig1-dev libfreetype-dev
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libvulkan-dev libdbus-1-dev
          version: 1

      # rust-toolchain.toml pins the toolchain cargo runs, along with its components.
      - name: rust toolchain
        run: rustup toolchain install

      # The check and lint jobs cache their whole target directory, so sccache would only
      # duplicate it. Only main saves that cache: a pull request's cache is visible to that pull
      # request alone, and would only push main's out of the repository's quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-${{ matrix.task }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        if: matrix.task == 'lint'
        run: cargo fmt --all --check

      - name: clippy
        if: matrix.task == 'lint'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # nextest runs the tests of every binary in parallel instead of one binary after another,
      # and skips the rustdoc pass for doctests the workspace does not have.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        if: matrix.task == 'test'
        with:
          tool: cargo-nextest

      # The dev profile optimises ui, views and the sound path for a usable debug build, which
      # makes compiling them for the tests take three times as long. The tests do not need it.
      - name: tests
        if: matrix.task == 'test'
        run: >-
          cargo nextest run --workspace --locked
          --config 'profile.dev.debug="line-tables-only"'
          --config 'profile.dev.package.ui.opt-level=0'
          --config 'profile.dev.package.views.opt-level=0'
          --config 'profile.dev.package.engine.opt-level=0'
          --config 'profile.dev.package.sound.opt-level=0'

  # The check job only ever sees the Linux side of a cfg. The next jobs lint the other two
  # platforms' code without paying for codegen, linking or an installer, which is the whole
  # cost of a release build. A tag still builds every target for real through release.yml.
  # A push to main runs them too, only to save the cache every pull request starts from.
  windows:
    name: clippy on x86_64-pc-windows-msvc
    if: >-
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Cargo on the runner's NTFS drive spends much of its time in the filesystem and Defender,
      # so Windows lints a copy of the checkout on a ReFS Dev Drive. The cache follows it there.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 20GB
          workspace-copy: true

      - name: rust toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint-x86_64-pc-windows-msvc
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE }}
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  # GitHub's macOS arm64 runners are often short of machines: a job waits five or ten minutes for
  # one, or is cancelled after fifteen without running a step. Only the code that compiles for
  # macOS alone needs a Mac to lint, so a pull request asks for one only when touches-macos.py
  # finds the change reaches that code. A push to main always lints macOS, which catches what
  # the guess lets through.
  touches-macos:
    name: touches macos
    if: >-
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.decide.outputs.macos }}
    steps:
      # A pull request checks out its merge into the base branch, whose first parent is the base.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: decide
        id: decide
        run: |
          macos=true
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            macos=$(python3 .github/ci/touches-macos.py HEAD^1 HEAD)
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  macos:
    name: clippy on aarch64-apple-darwin
    needs: touches-macos
    if: needs.touches-macos.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint-aarch64-apple-darwin
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked --target aarch64-apple-darwin -- -D warnings

  build:
    name: ${{ matrix.target }}
    if: >-
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # librespot-core's build script stamps a random build id and the date into the crate unless
      # this is set, so sccache missed it and every crate above it, music to views, on every run.
      SOURCE_DATE_EPOCH: "315532800"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Apple silicon cross-compiles for Intel faster than GitHub's Intel runners build natively.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64compatible
            setup: Sonora-Setup
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            setup: Sonora-Setup-arm64
    steps:
      - uses: actions/checkout@v7

      # Cargo on the runner's NTFS drive spends much of its time in the filesystem and Defender.
      # A ReFS Dev Drive takes the target directory instead, through a junction, so every path
      # below stays the same.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 40GB
      - name: put the target directory on the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DEV_DRIVE/target" | Out-Null
          New-Item -ItemType Junction -Path target -Target "$env:DEV_DRIVE/target" | Out-Null

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      # rust-toolchain.toml pins the toolchain cargo runs, and it only comes with the host's
      # standard library, so a cross-compiled target has to be added to it.
      - name: rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # sccache gives its server ten seconds to start, which the Windows arm64 runner sometimes
      # misses, and the timeout can only be raised from a config file.
      - name: start sccache
        shell: bash
        run: |
          set -euo pipefail
          conf="$RUNNER_TEMP/sccache.toml"
          echo 'server_startup_timeout_ms = 120000' > "$conf"
          echo "SCCACHE_CONF=$conf" >> "$GITHUB_ENV"
          SCCACHE_CONF="$conf" sccache --start-server

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      # These binaries are for trying a commit, not for shipping, so they trade a few percent of
      # speed for a build twice as fast. Without LTO the last step links in seconds instead of
      # minutes, and the three largest crates compile on every core. The dependencies keep one
      # codegen unit, since sccache serves them and smaller objects keep its cache inside the
      # repository's quota. release.yml builds nightlies and releases with the full profile.
      - name: build
        run: >-
          cargo build --release --locked --package sonora --target ${{ matrix.target }} --timings
          --config profile.release.lto=false
          --config profile.release.package.music.codegen-units=16
          --config profile.release.package.state.codegen-units=16
          --config profile.release.package.views.codegen-units=16

      # The timing report shows which crates and which link step a build spends its time on.
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/cargo-timing.html

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: stage the executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) cp "target/$TARGET/release/sonora.exe" "dist/sonora-${GITHUB_SHA:0:7}-$TARGET.exe" ;;
            *)       cp "target/$TARGET/release/sonora" "dist/sonora-${GITHUB_SHA:0:7}-$TARGET" ;;
          esac

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          SONORA_ARCH: ${{ matrix.arch }}
          SONORA_SETUP: ${{ matrix.setup }}
        run: |
          $env:SONORA_VERSION = "0.0.0"
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      # A convenience binary, not a release artefact: GitHub's artifact service times out often
      # enough that it must not be what turns a green build red.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
