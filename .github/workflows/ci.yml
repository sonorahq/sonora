name: ci

# A change that only touches prose, issue templates or bot configuration cannot change what
# compiles, so it skips the run entirely.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - .github/ISSUE_TEMPLATE/**
      - .github/triage/**
      - .github/labeler.yml
      - .coderabbit.yaml
  pull_request:
    paths-ignore:
      - "**/*.md"
      - .github/ISSUE_TEMPLATE/**
      - .github/triage/**
      - .github/labeler.yml
      - .coderabbit.yaml
  workflow_dispatch:

# A pull request event handled after the merge resolves github.ref to the base branch, so
# grouping by ref would let a late PR run and a push to main cancel each other. The PR number
# keeps the two apart. A new push to a pull request supersedes its last run, but a push to main
# never cancels one: main merges more often than its builds finish, so cancelling left nearly
# every commit without its binaries. A run already queued behind still gives way to a newer one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1

jobs:
  # A release branch only moves the version and the changelog over code main already checked,
  # and release.yml builds its merge for the tag, so neither its pull request nor its merge runs
  # here.
  # Lint and tests run as two jobs side by side, since they compile the workspace two different
  # ways and share nothing but the setup.
  check:
    name: ${{ matrix.name }}
    if: >-
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt and clippy
            task: lint
          - name: tests
            task: test
    steps:
      - uses: actions/checkout@v7

      # Restores the packages' files instead of running apt, which spends most of its time
      # refreshing the package index.
      - name: system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential pkg-config cmake mold
            libasound2-dev libfontconfig1-dev libfreetype-dev
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
            libvulkan-dev libdbus-1-dev
          version: 1

      # rust-toolchain.toml pins the toolchain cargo runs, along with its components.
      - name: rust toolchain
        run: rustup toolchain install

      # The check and lint jobs cache their whole target directory, so sccache would only
      # duplicate it. Only main saves that cache: a pull request's cache is visible to that pull
      # request alone, and would only push main's out of the repository's quota.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ci-${{ matrix.task }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        if: matrix.task == 'lint'
        run: cargo fmt --all --check

      - name: clippy
        if: matrix.task == 'lint'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The dev profile optimises ui, views and music for a usable debug build, which makes
      # compiling them for the tests take three times as long. The tests do not need it.
      - name: tests
        if: matrix.task == 'test'
        run: >-
          cargo test --workspace --locked
          --config 'profile.dev.debug="line-tables-only"'
          --config 'profile.dev.package.ui.opt-level=0'
          --config 'profile.dev.package.views.opt-level=0'
          --config 'profile.dev.package.music.opt-level=0'

  # The check job only ever sees the Linux side of a cfg. These two lint the other two
  # platforms' code without paying for codegen, linking or an installer, which is the whole
  # cost of a release build. A tag still builds every target for real through release.yml.
  # A push to main runs them too, only to save the cache every pull request starts from.
  platforms:
    name: clippy on ${{ matrix.target }}
    if: >-
      !startsWith(github.head_ref, 'release/') &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Cargo on the runner's NTFS drive spends much of its time in the filesystem and Defender,
      # so Windows lints a copy of the checkout on a ReFS Dev Drive. The cache follows it there.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 20GB
          workspace-copy: true

      - name: rust toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint-${{ matrix.target }}
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

  build:
    name: ${{ matrix.target }}
    if: >-
      github.event_name != 'pull_request' &&
      !contains(github.event.head_commit.message, 'from sonorahq/release/')
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          # Apple silicon cross-compiles for Intel faster than GitHub's Intel runners build natively.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: x64compatible
            setup: Sonora-Setup
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            arch: arm64
            setup: Sonora-Setup-arm64
    steps:
      - uses: actions/checkout@v7

      # Cargo on the runner's NTFS drive spends much of its time in the filesystem and Defender.
      # A ReFS Dev Drive takes the target directory instead, through a junction, so every path
      # below stays the same.
      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        if: runner.os == 'Windows'
        with:
          drive-size: 40GB
      - name: put the target directory on the Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DEV_DRIVE/target" | Out-Null
          New-Item -ItemType Junction -Path target -Target "$env:DEV_DRIVE/target" | Out-Null

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      # rust-toolchain.toml pins the toolchain cargo runs, and it only comes with the host's
      # standard library, so a cross-compiled target has to be added to it.
      - name: rust toolchain
        shell: bash
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: build
        run: cargo build --release --locked --package sonora --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      # A manual run checks the SignPath setup with the self-signed test certificate. Pushes skip
      # it, since a test signature is worth nothing to anyone downloading the build. Like the
      # upload below, a failure here must not turn the build red.
      - name: sign the executable
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/sign
        with:
          file: target/${{ matrix.target }}/release/sonora.exe
          artifact: unsigned-exe-${{ matrix.target }}
          policy: test-signing
          api-token: ${{ env.SIGNPATH_API_TOKEN }}

      - name: stage the executable
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows) cp "target/$TARGET/release/sonora.exe" "dist/sonora-${GITHUB_SHA:0:7}-$TARGET.exe" ;;
            *)       cp "target/$TARGET/release/sonora" "dist/sonora-${GITHUB_SHA:0:7}-$TARGET" ;;
          esac

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          SONORA_ARCH: ${{ matrix.arch }}
          SONORA_SETUP: ${{ matrix.setup }}
        run: |
          $env:SONORA_VERSION = "0.0.0"
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - name: sign the installer
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        uses: ./.github/actions/sign
        with:
          file: dist/${{ matrix.setup }}.exe
          artifact: unsigned-setup-${{ matrix.target }}
          policy: test-signing
          api-token: ${{ env.SIGNPATH_API_TOKEN }}

      # A convenience binary, not a release artefact: GitHub's artifact service times out often
      # enough that it must not be what turns a green build red.
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
