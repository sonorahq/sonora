name: nix

# Builds the flake's package for x86_64 and aarch64 Linux and for Apple silicon macOS and pushes it
# to sonora.cachix.org. A push to main caches main. release.yml runs it for every stable tag, moving
# the `stable` branch to the tag once every build is cached, and for every nightly. So a channel
# only ever points at a commit the cache already holds.

on:
  push:
    branches: [main]
    paths:
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - assets/**
      - COPYING
      - THIRD-PARTY.md
      - flake.nix
      - flake.lock
      - rust-toolchain.toml
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      branch:
        description: Branch to move to `ref` once every build is cached
        type: string
        default: ""
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        default: main
      branch:
        description: Branch to move to `ref` once every build is cached
        type: string
        default: ""

# A push to main never cancels the build before it, or merges landing faster than a build
# finishes would leave the cache without any of them. A queued run still gives way to a newer one.
concurrency:
  group: nix-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build:
    name: nix ${{ matrix.system }}
    if: github.repository == 'sonorahq/sonora'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - system: x86_64-linux
            os: ubuntu-24.04
          - system: aarch64-linux
            os: ubuntu-24.04-arm
          - system: aarch64-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: sonora
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `--fallback` builds a path from source when its download from a cache breaks off, so a
      # connection to cachix dropping halfway slows the build down instead of failing it.
      - name: build
        run: nix build --print-build-logs --fallback --no-link --print-out-paths .#packages.${{ matrix.system }}.default

  # A plain push, so a branch that would not fast-forward fails here instead of being rewound.
  promote:
    needs: build
    if: inputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: move ${{ inputs.branch }}
        env:
          BRANCH: ${{ inputs.branch }}
        run: git push origin "HEAD:refs/heads/$BRANCH"
