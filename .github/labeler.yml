subsonic:
  - changed-files:
      - any-glob-to-any-file: crates/music/src/subsonic/**

local:
  - changed-files:
      - any-glob-to-any-file: crates/music/src/local/**

# Only when the change is nothing but translation work. A feature that happens to add a string
# is not an i18n pull request, so every changed file has to fall inside this one pattern.
i18n:
  - changed-files:
      - any-glob-to-all-files: "{assets/i18n/**,crates/i18n/**,scripts/i18n-coverage.py,README.md}"

icons:
  - changed-files:
      - any-glob-to-any-file:
          - crates/icons/**
          - assets/icons/**
          - scripts/fetch-icons.py

webview:
  - changed-files:
      - any-glob-to-any-file: crates/webview/**

nix:
  - changed-files:
      - any-glob-to-any-file:
          - flake.nix
          - flake.lock
          - .envrc

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - flatpak/**
          - scripts/windows/**
          - scripts/generate-icons.py
          - scripts/generate-notices.py
          - assets/linux/**
          - assets/macos/**
          - assets/windows/**
          - assets/tray/**
          - about.toml

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

# CHANGELOG.md is touched by almost every feature, so it is deliberately not here: it marks a
# release note, not a documentation change.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - PRIVACY.md
          - docs/**
