          - crates/state/src/catalog.rs
          - crates/state/src/detail.rs
          - crates/state/src/artist.rs
          - crates/state/src/genre.rs
          - crates/state/src/history.rs
          - crates/state/src/home.rs
          - crates/state/src/song.rs
          - crates/state/src/pins.rs
          - crates/state/src/profile.rs
          - crates/views/src/screens/library/**
          - crates/views/src/screens/home/**
          - crates/views/src/screens/artist.rs
          - crates/views/src/screens/detail.rs
          - crates/views/src/screens/genre.rs
          - crates/views/src/screens/history.rs
          - crates/views/src/screens/song.rs
          - crates/views/src/screens/user.rs
          - crates/views/src/shared/album_grid.rs
          - crates/views/src/shared/shelves.rs
          - crates/views/src/shared/picks.rs
          - crates/views/src/shared/pins.rs
          - crates/views/src/shared/playlist_editor.rs
          - crates/views/src/shared/track_card.rs
