# Area labels for a pull request, derived from the paths it touches. These name parts of the
# app, not crates: a change lands in views and state whatever it is about, so those two say
# nothing and are deliberately absent. A path that maps to no area gets no label, which is
# better than a label nobody can filter on.
#
# The workflow runs with sync-labels, so every label named here is owned by the machine and a
# hand-added one survives only until the next push. Use a label that is not in this file, a
# priority or help wanted, when a human needs to mark something.

playback:
  - changed-files:
      - any-glob-to-any-file:
          - crates/music/src/audio.rs
          - crates/music/src/sink.rs
          - crates/music/src/equalizer.rs
          - crates/music/src/spectrum.rs
          - crates/music/src/spotify/playback.rs
          - crates/music/src/spotify/sink.rs
          - crates/state/src/playback.rs
          - crates/views/src/shared/visualizer.rs

player:
  - changed-files:
      - any-glob-to-any-file:
          - crates/state/src/queue.rs
          - crates/state/src/remote.rs
          - crates/state/src/discord.rs
          - crates/views/src/chrome/player_bar.rs
          - crates/views/src/chrome/sidebar_right.rs
          - crates/views/src/shared/transport.rs
          - crates/views/src/shells/fullscreen.rs

lyrics:
