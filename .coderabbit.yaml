# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: false
reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: "Summarize the change in at most two short sentences."
  review_status: false
  review_info: false
  review_details: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: false
  auto_approvals:
    enabled: false
  slop_detection:
    enabled: false
  auto_review:
    enabled: true
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: off
    description:
      mode: off
    issue_assessment:
      mode: off
    custom_checks: []
  post_merge_actions: []
chat:
  auto_reply: false
  art: false
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
  labeling:
    auto_apply_labels: false
