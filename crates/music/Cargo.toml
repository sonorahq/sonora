[package]
name = "music"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
bundled-sqlite = ["rusqlite/bundled", "storage/bundled-sqlite"]
# The host for the Widevine CDM, which Apple Music playback needs. Off by default: it compiles a
# C++ shim, so it wants a C++ compiler, and nothing else in the crate wants it.
widevine = ["widevine/cdm"]

[dependencies]
anyhow.workspace = true
ardftsrc.workspace = true
async-trait.workspace = true
base64.workspace = true
blowfish.workspace = true
bytes.workspace = true
cbc.workspace = true
fastrand.workspace = true
flate2.workspace = true
cpal.workspace = true
futures.workspace = true
gethostname.workspace = true
deunicode.workspace = true
dirs.workspace = true
http.workspace = true
image.workspace = true
jiff.workspace = true
librespot-core.workspace = true
librespot-playback.workspace = true
librespot-protocol.workspace = true
lofty.workspace = true
kakasi.workspace = true
log.workspace = true
md-5.workspace = true
oauth2.workspace = true
open.workspace = true
opensubsonic.workspace = true
percent-encoding.workspace = true
protobuf.workspace = true
reqwest.workspace = true
ring.workspace = true
roxmltree.workspace = true
rodio = { workspace = true, features = ["symphonia-aac", "symphonia-aiff", "symphonia-alac", "symphonia-isomp4", "symphonia-libopus", "symphonia-mkv", "flac", "mp3", "vorbis", "wav"] }
rtrb.workspace = true
rusqlite.workspace = true
rusty_aac.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
storage.workspace = true
symphonia.workspace = true
tempfile.workspace = true
time.workspace = true
tokio.workspace = true
widevine.workspace = true
ytmusic.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa.workspace = true
# TODO: move to cpal's native `pipewire` backend, and drop the trip through pipewire-pulse, once a
# cpal release sets `node.rate` (upstream commit ec35008, unreleased in 0.18) and CI builds on a
# distro with libpipewire 0.3.53 or newer.
cpal = { workspace = true, features = ["pulseaudio"] }
pulseaudio.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
env_logger.workspace = true
rustls.workspace = true
time = { workspace = true, features = ["macros"] }
