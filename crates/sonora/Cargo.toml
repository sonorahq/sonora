[package]
name = "sonora"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# the gpui frame overlay and repaint wash, off in normal builds
profiler = ["gpui/profiler"]
bundled-sqlite = ["state/bundled-sqlite"]

[dependencies]
anyhow.workspace = true
cli.workspace = true
dirs.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
i18n.workspace = true
icons.workspace = true
music = { workspace = true, features = ["widevine"] }
state.workspace = true
storage.workspace = true
input.workspace = true
router.workspace = true
ui.workspace = true
views.workspace = true
webview.workspace = true
reqwest.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt"] }
interprocess.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
ksni.workspace = true
zbus.workspace = true

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "block2",
  "NSEvent",
  "NSToolbar",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { workspace = true, features = ["NSString"] }
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
resvg.workspace = true
state = { workspace = true, features = ["bundled-sqlite"] }
widestring.workspace = true
windows.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[build-dependencies]
embed.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
