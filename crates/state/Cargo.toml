[package]
name = "state"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
bundled-sqlite = ["rusqlite/bundled", "music/bundled-sqlite", "storage/bundled-sqlite"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
control.workspace = true
dirs.workspace = true
discord-rich-presence.workspace = true
fastrand.workspace = true
futures.workspace = true
getrandom.workspace = true
gpui.workspace = true
i18n.workspace = true
icons.workspace = true
image.workspace = true
log.workspace = true
moka.workspace = true
music.workspace = true
notify.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
storage.workspace = true
tokio.workspace = true
ui.workspace = true
webview.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd.workspace = true
mpris-server.workspace = true

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
souvlaki.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-io-kit.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
