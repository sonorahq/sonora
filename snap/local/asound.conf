# cpal opens the ALSA default device, which inside the snap has to be the
# PulseAudio plugin: audio-playback hands out a PulseAudio/PipeWire socket and
# no direct access to the sound card.
pcm.!default {
    type pulse
    fallback "sysdefault"
    hint {
        show on
        description "Default ALSA Output (currently PulseAudio Sound Server)"
    }
}

ctl.!default {
    type pulse
    fallback "sysdefault"
}
